name: Release

# Publishes to npm when a GitHub Release is published. See CONTRIBUTING.md.
# Run it by hand (workflow_dispatch) to rehearse the tests and the packaging;
# a rehearsal does not ask the registry about the version and uploads nothing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Releases run one at a time, in the order they were started. "queue: max"
# keeps every waiting release; the default keeps only the newest waiting run
# and cancels the others. Rehearsals have their own group, so a rehearsal can
# never take the place of a waiting release. A running one is never cancelled.
concurrency:
  group: ${{ github.event_name == 'release' && 'release' || 'release-rehearsal' }}
  queue: max

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Check that the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'. The tag must be 'v$VERSION'."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/smoke-pack.mjs

  pack:
    name: Pack (rehearsal)
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The same npm and the same install as the publish job.
      - run: npm install -g npm@11

      - run: npm ci --ignore-scripts

      # Builds dist through prepack and lists the files a publish would upload.
      # Not "npm publish --dry-run": that asks the registry, so it fails for a
      # version that is already published, which is the state right after a
      # release.
      - run: npm pack --dry-run

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: test
    # npm Trusted Publishing needs a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must be the "Environment name" of the Trusted Publisher on npmjs.com.
    environment: npm
    permissions:
      contents: read
      # The OIDC token that npm checks instead of an access token.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      # This job can publish, so dependency install scripts do not run in it.
      # "npm publish" still builds dist through the package's own prepack script.
      - run: npm ci --ignore-scripts

      - name: Read the version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # A stable version goes to "latest", a version such as 1.0.0-beta.1 to
      # "next". A late or retried run of an older release must not move that
      # tag backwards, so the job stops unless the version is higher than the
      # one the tag points to now, and also when it cannot read the tags.
      # npm's own check is not enough: it covers only the implicit "latest",
      # leaves deprecated versions out, and is skipped when its registry read
      # fails.
      - name: Check that the dist-tag would not move backwards
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! DIST_TAGS="$(npm view fish-audio dist-tags --json)"; then
            echo "::error::Could not read the dist-tags of fish-audio from the registry. Nothing was published."
            exit 1
          fi
          # npm's own copy of semver.
          SEMVER="$(npm root -g)/npm/node_modules/semver"
          export DIST_TAGS SEMVER
          node -e '
            const semver = require(process.env.SEMVER);
            const { VERSION, TAG } = process.env;
            const current = JSON.parse(process.env.DIST_TAGS)[TAG];
            if (current && semver.gte(current, VERSION)) {
              console.log(`::error::The "${TAG}" dist-tag is at ${current}. Publishing ${VERSION} would not move it forwards. Nothing was published.`);
              process.exit(1);
            }
            console.log(`"${TAG}" is at ${current ?? "(not set)"}; publishing ${VERSION}.`);
          '

      # No NODE_AUTH_TOKEN in the publish steps: npm exchanges the job's OIDC
      # token itself.

      # No --tag for a stable version, so that npm's check for the implicit
      # "latest" stays on as a second safeguard. "--tag latest" switches it off.
      - name: Publish a stable version
        if: steps.version.outputs.tag == 'latest'
        run: npm publish --provenance --access public

      # npm requires an explicit tag for a pre-release version.
      - name: Publish a pre-release version
        if: steps.version.outputs.tag == 'next'
        run: npm publish --provenance --access public --tag next
