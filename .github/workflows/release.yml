name: Release

# Publishes to npm when a GitHub Release is published. See CONTRIBUTING.md.
# Run it by hand (workflow_dispatch) to rehearse everything except the upload.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and a running one is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Check that the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'. The tag must be 'v$VERSION'."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/smoke-pack.mjs

  dry-run:
    name: Publish (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11

      - run: npm ci --ignore-scripts

      - run: npm publish --dry-run --access public

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: test
    # npm Trusted Publishing needs a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must be the "Environment name" of the Trusted Publisher on npmjs.com.
    environment: npm
    permissions:
      contents: read
      # The OIDC token that npm checks instead of an access token.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      # This job can publish, so dependency install scripts do not run in it.
      # "npm publish" still builds dist through the package's own prepack script.
      - run: npm ci --ignore-scripts

      # A version such as 1.0.0-beta.1 goes to the "next" dist-tag, not "latest".
      - name: Choose the dist-tag
        id: dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC token itself.
      - run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
